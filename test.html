<script>
        const WORKER_URL = "https://api-khao-sat.lehaphuong510.workers.dev";
        let appConfig = {}; let activeCampaigns = []; let currentUser = ""; let finalData = {};
        let currentB1Index = 0; let b1Answers = {}; 
        let numMembers = 0; let phieuC_Data = []; let hoGiaDinh_Data = {}; 

        function switchScreen(id) { $('.screen').removeClass('active'); $('#' + id).addClass('active'); window.scrollTo(0,0); }
        function initSelect2() { $('.searchable-select').select2(); }

        window.onload = async () => {
            try {
                const resConfig = await fetch(`${WORKER_URL}/api/config`);
                if (resConfig.ok) {
                    appConfig = await resConfig.json();
                    Object.keys(appConfig.diachinh || {}).forEach(t => { $('#cb_tinh').append(new Option(t,t)); $('#nd_tinh').append(new Option(t,t)); });
                    if (appConfig.madantoc) appConfig.madantoc.forEach(dt => $('#nd_dantoc').append(new Option(dt.ten, dt.ma)));
                    if (appConfig.cauhoi) {
                        if (appConfig.cauhoi.A1) $('#title-a1').text(appConfig.cauhoi.A1.noi_dung);
                        if (appConfig.cauhoi.A2) $('#title-a2').text(appConfig.cauhoi.A2.noi_dung);
                        if (appConfig.cauhoi.B1) {
                            $('#title-b1').text(appConfig.cauhoi.B1.noi_dung);
                            appConfig.cauhoi.B1.lua_chon.forEach(lc => $('#list-b1').append(`<label style="display:block;margin-bottom:10px;"><input type="checkbox" class="cb-b1"> ${lc}</label>`));
                        }
                        if (appConfig.cauhoi.B2) {
                            $('#title-b2').text(appConfig.cauhoi.B2.noi_dung);
                            appConfig.cauhoi.B2.lua_chon.forEach(lc => $('#list-b2').append(`<label style="display:block;margin-bottom:10px;"><input type="checkbox" class="cb-b2"> ${lc}</label>`));
                        }
                    }
                }
            } catch (e) {}
            try {
                const resDots = await fetch(WORKER_URL, { method: 'POST', body: JSON.stringify({ action: "get_active_dots" }) });
                const dotData = await resDots.json();
                if(dotData.status === "success") activeCampaigns = dotData.dots;
            } catch (e) {}
            initSelect2();
            $('#cb_tinh').on('change', loadCbPhuong); $('#nd_tinh').on('change', loadNdPhuong); $('#nd_phuong').on('change', loadNdThon);
            $('#nd_thon').on('change', function() { $(this).val() === 'Khác' ? $('#nd_thon_khac').slideDown() : $('#nd_thon_khac').slideUp(); });
        };

        function startNguoiDan() { switchScreen('screen-nd-step1'); loadNdThon(); }
        function loadCbPhuong() { let t = $('#cb_tinh').val(); $('#cb_phuong').empty().append('<option value="">-- Chọn Phường/Xã --</option>'); if(t && appConfig.diachinh[t]) appConfig.diachinh[t].forEach(p => $('#cb_phuong').append(new Option(p,p))); }
        function loadNdPhuong() { let t = $('#nd_tinh').val(); $('#nd_phuong').empty().append('<option value="">-- Chọn Phường/Xã --</option>'); if(t && appConfig.diachinh[t]) appConfig.diachinh[t].forEach(p => $('#nd_phuong').append(new Option(p,p))); loadNdThon(); }
        function loadNdThon() { let t = $('#nd_tinh').val(), p = $('#nd_phuong').val(); $('#nd_thon').empty().append('<option value="">-- Chọn Thôn/Tổ --</option>'); activeCampaigns.filter(d => d.tinh===t && d.phuong===p).forEach(d => $('#nd_thon').append(new Option(d.thon, d.id_dot))); $('#nd_thon').append(new Option("Khác", "Khác")); }

        function toiBuocRouting() {
            if ($('#nd_cccd').val().length !== 12) return alert("❌ Vui lòng nhập ĐỦ 12 số CCCD!");
            if (!$('#nd_dantoc').val() || !$('#nd_hoten').val() || !$('#nd_thon').val() || !$('#nd_phuong').val() || !$('#nd_tinh').val()) return alert("❌ Vui lòng nhập đủ thông tin cá nhân/địa chỉ!");
            if ($('#nd_thon').val() === "Khác" && !$('#nd_thon_khac').val().trim()) return alert("❌ Vui lòng nhập tên Thôn/Tổ!");
            ghiNhanDataNgamSync(); switchScreen('screen-nd-routing');
        }

        function ghiNhanDataNgamSync() {
            finalData.B = $('#nd_hoten').val().toUpperCase(); finalData.CCCD = "'" + $('#nd_cccd').val();
            finalData.ID_Dot = $('#nd_thon').val() !== "Khác" ? $('#nd_thon').val() : "";
            const t = $('#nd_tinh').val(), p = $('#nd_phuong').val(), isDoThi = (p||"").includes('Phường')?1:2;
            const kvInfo = appConfig.diachinh_kv ? appConfig.diachinh_kv[t] : null;
            finalData.Tinh_thanh = t; finalData.Phuong_xa = p; finalData.Khuvuc = isDoThi;
            finalData.Barem = isDoThi===1 ? "Đô thị" : "Nông thôn - " + (kvInfo?.nt_rieng || kvInfo?.chung || "");
        }
        async function ghiNhanDataNgam() { ghiNhanDataNgamSync(); if (finalData.ID_Dot) { finalData.action = "submit_phieuA"; await fetch(WORKER_URL, { method: 'POST', body: JSON.stringify(finalData) }); } }

        function checkB1() {
            if ($('.cb-b1:checked').length > 0) {
                finalData["0"]=0; finalData["E"]=0;
                let html = "<div class='review-checklist'><strong>Lý do rớt (Nhận dạng 1):</strong><br>"; $('.cb-b1:checked').each(function(){ html+=`<div>✅ ${this.parentElement.innerText}</div>`; }); html+="</div>";
                $('#review-content').html(`<p><strong>Kết luận:</strong> <span style="color:red; font-weight:bold;">Không thuộc diện rà soát tiếp</span></p>${html}`);
                $('#btn-submit-review').text("Kết thúc"); switchScreen('screen-nd-review');
            } else { finalData["0"]=1; switchScreen('screen-nd-step3'); }
        }

        function checkB2() {
            let tongD=0; let html="<div class='review-checklist'><strong>Các tiêu chí nhận dạng 2:</strong><br>";
            $('.cb-b2').each((i,cb) => { let v = cb.checked?1:0; finalData[i+1]=v; tongD+=v; html+=`<div>${v?'✅':'⬜'} ${cb.parentElement.innerText}</div>`; });
            html+="</div>"; finalData["D"]=tongD; finalData["E"] = tongD<4 ? 1 : 0;
            let res = finalData["E"] ? '<span style="color:green; font-weight:bold;">Đủ điều kiện rà soát tiếp (Tới Phiếu B1)</span>' : '<span style="color:red; font-weight:bold;">Không thuộc diện rà soát tiếp</span>';
            $('#review-content').html(`<p><strong>Điểm Nhận dạng 2:</strong> ${tongD}/4</p><p><strong>Kết luận:</strong> ${res}</p>${html}`);
            $('#btn-submit-review').text(finalData["E"] ? "Xác nhận & Tới Phiếu B1" : "Kết thúc"); switchScreen('screen-nd-review');
        }

        async function submitDataXacNhan() { await ghiNhanDataNgam(); finalData["E"]===1 ? startPhieuB1() : location.reload(); }

        // --- PHIẾU B1 ---
        function startPhieuB1() { currentB1Index=0; switchScreen('screen-nd-b1'); renderB1(); }
        function renderB1() {
            let q = appConfig.phieu_b1[currentB1Index]; $('#b1-progress').text(`(Câu ${currentB1Index+1}/${appConfig.phieu_b1.length})`);
            $('#b1-question-text').text(q.noidung);
            q.ghichu ? $('#b1-ghichu-container').show() && $('#b1-ghichu-content').text(q.ghichu) : $('#b1-ghichu-container').hide();
            let optsHTML=""; let saved = b1Answers[q.ma];
            q.options.forEach((opt, idx) => {
                let type = q.isMulti?"checkbox":"radio", chk = (q.isMulti && Array.isArray(saved) && saved.includes(idx)) || (!q.isMulti && saved===idx) ? "checked" : "";
                optsHTML+=`<label class="b1-option-label"><input type="${type}" name="b1_opt" class="b1-input" value="${idx}" ${chk}> ${opt.text}</label>`;
            });
            $('#b1-options').html(optsHTML);
        }
        function saveCurrentB1Answer() {
            let q=appConfig.phieu_b1[currentB1Index], sel=$('.b1-input:checked');
            if(sel.length>0){ b1Answers[q.ma] = q.isMulti ? Array.from(sel).map(e=>Number(e.value)) : Number(sel.val()); return true; }
            return false;
        }
        function prevB1() { if(currentB1Index>0) { saveCurrentB1Answer(); currentB1Index--; renderB1(); } else alert("Đây là câu đầu tiên!"); }
        
        function nextB1() { 
            if(!saveCurrentB1Answer()) return alert("Vui lòng chọn đáp án trước khi đi tiếp!"); 
            if(currentB1Index < appConfig.phieu_b1.length - 1) { 
                currentB1Index++; renderB1(); 
            } else { 
                if(!validateAvsB1()) return; // CHỐT TRẠM 1: CHẶN LỖI PHIẾU A & B1
                showReviewB1(); 
            } 
        }

        // ================= SECURITY CHECK 1: PHIẾU A VS B1 =================
        function validateAvsB1() {
            let errs = [];
            let b1_13 = b1Answers['B1.13']; let b1_13_khong = Array.isArray(b1_13) ? b1_13.includes(9) : b1_13 === 9;
            if (!b1_13_khong && !finalData["5"]) errs.push("Phiếu B1 khai CÓ ĐẤT ĐAI (B1.13), nhưng Phiếu A mục 'Có đất đai/nhà xưởng...' chưa được chọn.");
            
            let b1_8 = b1Answers['B1.8'];
            if ((b1_8 === 1 || b1_8 === 2) && !finalData["7"]) errs.push("Phiếu B1 khai Diện tích nhà >= 30m2 (B1.8), nhưng Phiếu A mục 'Diện tích >= 25m2' chưa được chọn.");
            
            let b1_12 = b1Answers['B1.12'] || []; if(!Array.isArray(b1_12)) b1_12 = [b1_12];
            let hasXeTau = b1_12.some(x => [1,2,3,4].includes(x));
            if (finalData["1"] && !hasXeTau) errs.push("Phiếu A khai Có Xe máy/Tàu thuyền, nhưng B1.12 không ghi nhận.");
            if (finalData["2"] && !b1_12.some(x => [9,10,11].includes(x))) errs.push("Phiếu A khai Có Điều hòa/Tủ lạnh, nhưng B1.12 không ghi nhận.");
            if (finalData["3"] && !b1_12.includes(13)) errs.push("Phiếu A khai Có Bình tắm nóng, nhưng B1.12 không có.");
            if (finalData["4"] && !b1_12.includes(12)) errs.push("Phiếu A khai Có Máy giặt, nhưng B1.12 không có.");
            if (finalData["6"] && b1Answers['B1.9'] !== 2) errs.push("Phiếu A khai Tiêu thụ điện >= 150kWh, nhưng B1.9 không chọn mức này.");
            if (finalData["9"] && b1Answers['B1.5'] !== 1) errs.push("Phiếu A khai Có người làm việc theo Hợp đồng LĐ, nhưng B1.5 không chọn mục này.");

            if (errs.length > 0) {
                alert("⚠️ CHƯA CÓ SỰ NHẤT QUÁN GIỮA PHIẾU A & B1:\n\n- " + errs.join("\n- ") + "\n\nVui lòng quay lại Phiếu A (bằng nút Sửa ở bước trước) hoặc điều chỉnh Phiếu B1.");
                return false;
            }
            return true;
        }

        function getVungInfo() {
            const t=$('#nd_tinh').val(), p=$('#nd_phuong').val(), isDoThi=(p||"").includes('Phường');
            const kvInfo = appConfig.diachinh_kv ? appConfig.diachinh_kv[t] : null; let tenVung="", maVung="";
            if(isDoThi){ tenVung = kvInfo?.chung||""; maVung = appConfig.diemcong_dothi?.[tenVung]?.ma || "TPTW"; }
            else { tenVung = kvInfo?.nt_rieng || kvInfo?.chung || ""; maVung = appConfig.diemcong_dothi?.[tenVung]?.ma || "DBSH"; }
            const diemCongDoThi = (isDoThi && appConfig.diemcong_dothi?.[tenVung]?.diem) || 0;
            return { isDoThi, tenVung, maVung, diemCongDoThi, colLookup: isDoThi?"DoThi_Chung":"NT_"+maVung, diemChuan: isDoThi?220:190, txt: isDoThi?"Đô thị":"Nông thôn" };
        }

        function showReviewB1() {
            const vi = getVungInfo(); let totalScore=0, html="<div class='review-checklist' style='margin-top: 15px; padding: 10px; background: #fff; border: 1px solid #ccc; border-radius: 5px;'>";
            appConfig.phieu_b1.forEach(q => {
                let ans = b1Answers[q.ma]; html+=`<div style="padding-bottom:10px;"><strong>${q.noidung}</strong><br>`;
                let processOpt = (idx) => { let obj=q.options[idx], sc=obj[vi.colLookup]||0; if(!obj.text.toLowerCase().startsWith("không có")) totalScore+=sc; html+=`✅ ${obj.text} <span style="color:#0056b3; font-weight:bold; float:right;">(+${sc})</span><br>`; };
                if(q.isMulti && Array.isArray(ans)) ans.forEach(processOpt); else if(ans!==undefined) processOpt(ans);
                html+="</div>";
            });
            if(vi.diemCongDoThi>0) { totalScore+=vi.diemCongDoThi; html+=`<div style="background:#eef5ff; padding:8px; border-radius:3px;"><strong>Cộng Đô thị vùng (${vi.tenVung}):</strong> <span style="color:#0056b3; font-weight:bold; float:right;">+${vi.diemCongDoThi}</span></div>`; }
            html+="</div>";
            let isPass = totalScore <= vi.diemChuan; finalData.TongDiemB1 = totalScore; finalData.KetQuaB1 = isPass?"Đậu":"Rớt";
            $('#review-content-b1').html(`<p><strong>Phân loại:</strong> ${vi.txt} - ${vi.tenVung||"KXĐ"}</p><p><strong>Điểm chuẩn tối đa:</strong> ${vi.diemChuan}</p><p><strong>Tổng điểm B1:</strong> <span style="color:red;font-weight:bold;font-size:18px">${totalScore}</span></p><p><strong>Kết luận:</strong> ${isPass?'<span style="color:green;font-weight:bold;">Đạt (Đủ điều kiện tới B2)</span>':'<span style="color:red;font-weight:bold;">Không thuộc diện rà soát tiếp</span>'}</p>${html}`);
            $('#btn-submit-review-b1').text(isPass?"Xác nhận & Đi tới Phiếu B2 & C":"Kết thúc"); switchScreen('screen-nd-review-b1');
        }

        function prepareWordDataB1() {
            const vi = getVungInfo();
            let d = { Khuvuc:vi.isDoThi?1:2, Tinh_thanh:$('#nd_tinh').val(), Phuong_xa:$('#nd_phuong').val(), Thon_to:$('#nd_thon').val()==="Khác"?$('#nd_thon_khac').val():$('#nd_thon option:selected').text(), B:$('#nd_hoten').val().toUpperCase(), Ma_Dantoc:$('#nd_dantoc').val(), TongDiem_B1:finalData.TongDiemB1 };
            let cccd = $('#nd_cccd').val(); for(let i=0;i<12;i++) d[`C${i+1}`] = cccd[i]||"";
            appConfig.phieu_b1.forEach(q => {
                let m = q.ma.replace('.','_'), ans = b1Answers[q.ma], diem=0, hasV=false;
                q.options.forEach((o,i) => d[`x_${m}_${i}`]=""); d[`Diem_${m}`]="";
                let checkObj = (i) => { let o=q.options[i]; if(!o.text.toLowerCase().startsWith("không có")){ d[`x_${m}_${i}`]="x"; diem+=o[vi.colLookup]||0; hasV=true; }};
                if(q.isMulti && Array.isArray(ans)) ans.forEach(checkObj); else if(ans!==undefined) checkObj(ans);
                if(hasV) d[`Diem_${m}`]=diem;
            });
            ["DBSH","MNPB","BTB","DHTN","DNB","DBSCL","TW"].forEach(v => { d[`x_B1_15_${v}`]=""; d[`Diem_B1_15_${v}`]=""; });
            if(vi.isDoThi && vi.diemCongDoThi>0) { let vMap=vi.maVung==="TPTW"?"TW":vi.maVung; d[`x_B1_15_${vMap}`]="x"; d[`Diem_B1_15_${vMap}`]=vi.diemCongDoThi; }
            return d;
        }

        function getB1TemplateUrl() { return `https://raw.githubusercontent.com/lehaphuong510/trasoathongheo/main/PhieuB1_${getVungInfo().isDoThi?"Dothi":getVungInfo().maVung}.docx`; }

        async function handleDocxPreview(data, url, modalId, containerId) {
            $(`#${modalId}`).show(); $(`#${containerId}`).html("<p style='padding:20px;'>Đang xử lý dữ liệu và tải bản xem trước...</p>");
            try {
                const zip = new PizZip(await (await fetch(url)).arrayBuffer());
                const doc = new window.docxtemplater(zip, { paragraphLoop: true, linebreaks: true }); doc.render(data);
                const out = doc.getZip().generate({ type: "blob", mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" });
                $(`#${containerId}`).html(""); await docx.renderAsync(out, document.getElementById(containerId), null, { className: "docx-preview", inWrapper: true, ignoreWidth: true, ignoreHeight: true });
            } catch(e) { $(`#${containerId}`).html(`<p style='color:red; padding:20px;'>Lỗi hiển thị: ${e.message}</p>`); }
        }
        async function handleDocxDownload(data, url, filename) {
            try {
                const zip = new PizZip(await (await fetch(url)).arrayBuffer());
                const doc = new window.docxtemplater(zip, { paragraphLoop: true, linebreaks: true }); doc.render(data);
                saveAs(doc.getZip().generate({ type: "blob", mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" }), filename);
            } catch(e) { alert("Lỗi tải file Word!"); }
        }
        async function handlePdfDownload(data, url, filename, btn) {
            let ogText = btn.innerText; btn.innerText="⏳ Đang tạo PDF..."; btn.disabled=true;
            try {
                const zip = new PizZip(await (await fetch(url)).arrayBuffer());
                const doc = new window.docxtemplater(zip, { paragraphLoop: true, linebreaks: true }); doc.render(data);
                const pdfRes = await fetch(WORKER_URL, { method: "POST", body: JSON.stringify({ action: "convert_pdf", docxBase64: doc.getZip().generate({ type: "base64" }) }) });
                const pdfData = await pdfRes.json();
                if(pdfData.status==="success"){
                    const chars = atob(pdfData.pdfBase64), nums = new Array(chars.length);
                    for(let i=0; i<chars.length; i++) nums[i] = chars.charCodeAt(i);
                    saveAs(new Blob([new Uint8Array(nums)], { type: "application/pdf" }), filename);
                } else alert("Lỗi convert PDF: " + pdfData.message);
            } catch(e) { alert("Lỗi kết nối máy chủ PDF!"); }
            btn.innerText=ogText; btn.disabled=false;
        }

        function xemTruocDocxB1() { $('#modal-title').text("Xem Trước Phiếu B1"); handleDocxPreview(prepareWordDataB1(), getB1TemplateUrl(), 'myModal', 'modal-body'); }
        function taiFileWordB1() { taiFileWord(prepareWordDataB1(), getB1TemplateUrl(), `PhieuB1_${finalData.B.replace(/\s+/g,'_')}.docx`); }
        function taiFilePDFB1(btn) { handlePdfDownload(prepareWordDataB1(), getB1TemplateUrl(), `PhieuB1_${finalData.B.replace(/\s+/g,'_')}.pdf`, btn); $('#dl-b1-options').slideUp(); }
        function editB1() { switchScreen('screen-nd-b1'); }
        function submitB1XacNhan() { 
            if(b1Answers['B1.1'] !== undefined) {
                let mapN = [1,2,3,4,5,6,7];
                $('#num_members').val(mapN[b1Answers['B1.1']]);
            }
            if(finalData.KetQuaB1==="Đậu") { switchScreen('screen-nd-phieuc-init'); } else location.reload(); 
        }

        // ================== PHIẾU C & B2 ENGINE ================== //
        
        function initPhieuCMembers() {
            let n = parseInt($('#num_members').val());
            if(isNaN(n) || n<1 || n>20) return alert("❌ Vui lòng nhập số thành viên hợp lệ (từ 1 đến 20)!");
            numMembers = n; phieuC_Data = Array.from({length: n}, () => ({})); hoGiaDinh_Data = {};
            
            let tabsHtml = "", contentHtml = "";
            let pCQuestions = (appConfig.phieu_c || []).filter(q => !q.isHo && !(q.ghichu||"").includes('Matrix_CS')); 

            for(let i=0; i<n; i++) {
                let tabName = i===0 ? "👤 1. Chủ hộ" : `👤 ${i+1}. Thành viên ${i+1}`;
                tabsHtml += `<div class="tab-member ${i===0?'active':''}" id="tab-btn-${i}" onclick="switchMemberTab(${i})">${tabName}</div>`;
                
                contentHtml += `<div id="member-content-${i}" class="tab-content ${i===0?'active':''}">
                    <h3 style="color:#0056b3; margin-top:0;">${tabName}</h3>`;
                
                pCQuestions.forEach(q => {
                    let m = q.ma, display = "block";
                    contentHtml += `<div class="phieuc-question" id="q_${i}_${m}" style="display:${display};">
                        <strong style="color:#333;">${m}. ${q.noidung}</strong> ${q.k_bat_buoc?'<span style="color:#888; font-size:14px;">(Không bắt buộc)</span>':''}<br>`;
                    
                    if(q.options && q.options.length > 0 && !q.options[0].text.includes('(fill)') && !q.options[0].text.includes('(date)') && !q.options[0].text.includes('(dropdown)')) {
                        q.options.forEach((opt) => {
                            let isFillKhac = opt.text.includes('(fill)'); let textL = opt.text.replace('(fill)', '').trim();
                            let type = q.isMulti ? 'checkbox' : 'radio';
                            contentHtml += `<label class="b1-option-label" style="padding:10px; margin-top:5px; margin-bottom:5px;"><input type="${type}" name="pC_${i}_${m}" value="${opt.ma_lc}" onchange="evalLogicPhiencC(${i})"> ${textL}</label>`;
                            if(isFillKhac) contentHtml += `<input type="text" id="txt_pC_${i}_${m}_${opt.ma_lc}" placeholder="Ghi rõ..." style="display:none; margin-left:20px; width:90%; margin-top:5px; margin-bottom:10px;">`;
                        });
                    } else if (q.options.length > 0 && q.options[0].text.includes('(date)')) {
                        contentHtml += `<input type="date" id="pC_${i}_${m}" onchange="evalLogicPhiencC(${i})" style="margin-top:5px;">`;
                    } else if (q.options.length > 0 && q.options[0].text.includes('(dropdown)')) {
                        contentHtml += `<select id="pC_${i}_${m}" class="searchable-select" style="width:100%; margin-top:5px;"><option value="">-- Chọn Dân tộc --</option>`;
                        if(appConfig.madantoc) appConfig.madantoc.forEach(dt => contentHtml += `<option value="${dt.ma}">${dt.ten}</option>`);
                        contentHtml += `</select>`;
                    } else {
                        let isNum = m==='C8'||m==='C9', suffix = m==='C8'?" cm":m==='C9'?" kg":"";
                        contentHtml += `<div style="display:flex; align-items:center; margin-top:5px;"><input type="text" id="pC_${i}_${m}" placeholder="Nhập... ${suffix}" oninput="if(${isNum}) this.value=this.value.replace(/,/g,'.').replace(/[^0-9.]/g,''); evalLogicPhiencC(${i})"> <span style="margin-left:5px; white-space:nowrap; font-weight:bold;">${suffix}</span></div>`;
                    }
                    contentHtml += `</div>`;
                });

                let navHtml = `<div style="margin-top:20px; text-align:right;">`;
                if(i > 0) navHtml += `<button class="btn btn-secondary" onclick="prevMember(${i})">Quay lại</button> `;
                if(i < n - 1) navHtml += `<button class="btn" style="background-color:#17a2b8;" onclick="nextMember(${i})">Thành viên tiếp theo →</button>`;
                else navHtml += `<button class="btn" style="background-color:#28a745;" onclick="nextMember(${i})">Xong Thành viên - Tới Câu hỏi Hộ →</button>`;
                navHtml += `</div>`;

                contentHtml += navHtml + `</div>`;
            }
            $('#tabs-container').html(tabsHtml); $('#tabs-content-container').html(contentHtml);
            $('.searchable-select').select2();
            
            $('input[type="radio"], input[type="checkbox"]').on('change', function() {

                $('#pC_0_C2').val($('#nd_hoten').val());
                $('#pC_0_C5').val($('#nd_cccd').val().replace("'",""));

                $(`input[name="pC_0_C3"][value="1"]`).prop('checked', true).trigger('change');
            }
            
            switchScreen('screen-nd-phieuc-members'); 
            for(let i=0; i<n; i++) evalLogicPhiencC(i); 
        }

        function prevMember(idx) { switchMemberTab(idx - 1); }
        function nextMember(idx) {
            if(!validateSingleMember(idx)) return alert(`⚠️ HỆ THỐNG BÁO LỖI:\nVui lòng hoàn thành các thông tin bắt buộc (được đóng khung đỏ) của Thành viên này trước khi đi tiếp!`);
            if(idx < numMembers - 1) switchMemberTab(idx + 1);
            else checkAndGoHoGiaDinh();
        }

        function switchMemberTab(idx) {
            $('.tab-member').removeClass('active'); $('.tab-content').removeClass('active');
            $(`#tab-btn-${idx}`).addClass('active'); $(`#member-content-${idx}`).addClass('active');
            window.scrollTo(0,0);
        }

        function tinhTuoi(dateStr) {
            if(!dateStr) return {nam: -1, thang: -1};
            let d = new Date(dateStr), now = new Date();
            let thang = (now.getFullYear() - d.getFullYear()) * 12 + (now.getMonth() - d.getMonth());
            if(now.getDate() < d.getDate()) thang--;
            return { nam: Math.floor(thang/12), thang: thang };
        }

        function evalLogicPhiencC(idx) {
            let ageY = tinhTuoi($(`#pC_${idx}_C4`).val()).nam;
            let questions = (appConfig.phieu_c || []).filter(q => !q.isHo && !(q.ghichu||"").includes('Matrix_CS'));
            let skipUntilMa = null;

            questions.forEach(q => {
                let m = q.ma, $qDiv = $(`#q_${idx}_${m}`);
                if (skipUntilMa) {
                    if (m === skipUntilMa) skipUntilMa = null; 
                    else { $qDiv.hide(); return; }
                }
                let showByAge = true;
                if(q.dieu_kien) {
                    if(ageY !== -1) { try { showByAge = new Function("tuoi", "return tuoi " + q.dieu_kien)(ageY); } catch(e){} }
                    else showByAge = false; 
                }
                if (showByAge) {
                    $qDiv.show();
                    if (q.options && q.options.length > 0) {
                        let sel = $(`input[name="pC_${idx}_${m}"]:checked`);
                        if (sel.length > 0) {
                            let optObj = q.options.find(o => o.ma_lc === sel.val());
                            if (optObj && optObj.next) skipUntilMa = optObj.next;
                        }
                    }
                } else { $qDiv.hide(); }
            });
        }

        function validateSingleMember(idx) {
            let pCQuestions = (appConfig.phieu_c || []).filter(q => !q.isHo && !(q.ghichu||"").includes('Matrix_CS'));
            let ok = true;
            $(`#tab-btn-${idx}`).removeClass('error');

            pCQuestions.forEach(q => {
                let $qDiv = $(`#q_${idx}_${q.ma}`);
                let isVisible = $qDiv.is(':visible');
                $qDiv.removeClass('error');

                if(!isVisible) { phieuC_Data[idx][q.ma] = null; return; } 
                
                let val = null;
                if(q.options && q.options.length>0 && !q.options[0].text.includes('(fill)') && !q.options[0].text.includes('(date)') && !q.options[0].text.includes('(dropdown)')) {
                    let sel = $(`input[name="pC_${idx}_${q.ma}"]:checked`);
                    if(q.isMulti) { val = []; sel.each(function(){ val.push($(this).val()); }); } 
                    else { val = sel.val(); }
                } else {
                    val = $(`#pC_${idx}_${q.ma}`).val();
                    if(q.ma==='C8' || q.ma==='C9') val = parseFloat(val); 
                }
                
                if(!q.k_bat_buoc && (val===null || val==="" || (Array.isArray(val) && val.length===0) || (typeof val === 'number' && isNaN(val)))) { 
                    ok = false;
                    $qDiv.addClass('error');
                }
                phieuC_Data[idx][q.ma] = val;
            });
            if(!ok) $(`#tab-btn-${idx}`).addClass('error');
            return ok;
        }

            // AUTO FILL CHO CÁC MỤC HỘ GIA ĐÌNH TỪ PHIẾU B1
            if(b1Answers['B1.7']) { let ans = Array.isArray(b1Answers['B1.7']) ? b1Answers['B1.7'] : [b1Answers['B1.7']]; ans.forEach(a => $(`input[name="ho_B2.7"][value="${a}"]`).prop('checked', true)); }
            if(b1Answers['B1.11']) { let ans = Array.isArray(b1Answers['B1.11']) ? b1Answers['B1.11'] : [b1Answers['B1.11']]; ans.forEach(a => $(`input[name="ho_B2.11"][value="${a}"]`).prop('checked', true)); }
            if(b1Answers['B1.10'] === 0) { $(`input[name="ho_B2.10"][value="1"]`).prop('checked', true); } // Nếu "Chỉ dùng nước máy" thì tự động tick "Nước máy"
            
            $('input[type="radio"], input[type="checkbox"]').on('change', function() {
                let name = $(this).attr('name'), isChk = $(this).is(':checked'), val = $(this).val();
                let txtBox = $(`#txt_${name}_${val}`); if(txtBox.length) isChk ? txtBox.slideDown() : txtBox.slideUp();
            });

        function getAnswerText(q, val) {
            if(val === null || val === "" || val === undefined) return "";
            if(q.ma === 'C6') { let dt = (appConfig.madantoc||[]).find(d => d.ma == val); return dt ? dt.ten : val; }
            if(q.options && q.options.length > 0 && !q.options[0].text.includes('(fill)') && !q.options[0].text.includes('(date)') && !q.options[0].text.includes('(dropdown)')) {
                let getT = (v) => { let o = q.options.find(x => x.ma_lc == v); return o ? o.text.replace('(fill)','').trim() : v; };
                if(Array.isArray(val)) return val.map(getT).join(", ");
                return getT(val);
            }
            if(q.options && q.options.length > 0 && q.options[0].text.includes('(date)')) {
                let d = new Date(val); return isNaN(d) ? val : `${('0'+d.getDate()).slice(-2)}/${('0'+(d.getMonth()+1)).slice(-2)}/${d.getFullYear()}`;
            }
            return val;
        }

        // ================= SECURITY CHECK 2: SIÊU KIỂM TRA CHÉO TỔNG THỂ =================
        function crossCheckSecurity() {
            let errs = []; let N = numMembers;
            let hoQ = (appConfig.phieu_c || []).filter(q => q.isHo);
            
            // Cập nhật biến hoGiaDinh_Data tạm thời để tính toán
            hoQ.forEach(q => {
                if(q.options && q.options.length>1) {
                    let sel = $(`input[name="ho_${q.ma}"]:checked`);
                    if(q.isMulti) { hoGiaDinh_Data[q.ma] = []; sel.each(function(){ hoGiaDinh_Data[q.ma].push($(this).val()); }); }
                    else hoGiaDinh_Data[q.ma] = sel.val();
                } else if(q.options && q.options.length===1 && q.options[0].text.includes('(fill)')){
                    hoGiaDinh_Data[q.ma] = $(`#ho_${q.ma}`).val();
                }
            });

            // 1. Logic Nước Sinh Hoạt (B1.10 vs B2.10)
            let b1_10 = b1Answers['B1.10'];
            let b2_10_ans = hoGiaDinh_Data['B2.10'] || [];
            if (b1_10 === 1 && b2_10_ans.length === 1 && b2_10_ans.includes('1')) errs.push("Chưa có sự nhất quán: Ở Phiếu B1 (Câu B1.10) anh/chị xác nhận Không dùng nước máy, nhưng tại Phiếu C lại chỉ đánh dấu 'Nước máy'.");

            // 2. Logic Số người phụ thuộc (B1.3 vs Phiếu C)
            let b1_3 = b1Answers['B1.3']; // 0: Không người, 1: 1 người, 2: Không đúng (>=2)
            let phuThuocCount = phieuC_Data.filter(p => { let age = tinhTuoi(p.C4).nam; return (age !== -1 && age < 16) || (p.C16 && p.C16.length > 0); }).length;
            if (b1_3 === 0 && phuThuocCount !== 0) errs.push(`Mâu thuẫn: Phiếu B1 khai 0 người phụ thuộc, nhưng danh sách chi tiết có ${phuThuocCount} người.`);
            if (b1_3 === 1 && phuThuocCount !== 1) errs.push(`Mâu thuẫn: Phiếu B1 khai 1 người phụ thuộc, nhưng danh sách chi tiết có ${phuThuocCount} người.`);
            if (b1_3 === 2 && phuThuocCount < 2) errs.push(`Mâu thuẫn: Phiếu B1 khai >=2 người phụ thuộc, nhưng danh sách chi tiết chỉ có ${phuThuocCount} người.`);

            // 3. Logic Việc làm phi nông nghiệp (B1.5 vs C18, C19)
            let b1_5 = b1Answers['B1.5']; // 0: CC, 1: HĐLĐ, 2: Thuê, 3: Không
            let hasCC = phieuC_Data.some(p => p.C18 === '1');
            let hasHDLD = phieuC_Data.some(p => p.C19 === '1');
            let hasThue = phieuC_Data.some(p => p.C18 === '3');
            if (b1_5 === 0 && !hasCC) errs.push("Mâu thuẫn: Phiếu B1 khai có Công chức/Viên chức nhưng không có thành viên nào mang Loại việc làm này.");
            if (b1_5 === 1 && !hasHDLD) errs.push("Mâu thuẫn: Phiếu B1 khai có Hợp đồng lao động nhưng không có thành viên nào ghi nhận HĐLĐ.");
            if (b1_5 === 2 && !hasThue) errs.push("Mâu thuẫn: Phiếu B1 khai Làm thuê cho hộ gia đình nhưng không thành viên nào ghi nhận Loại việc làm này.");
            if (b1_5 === 3 && (hasCC || hasHDLD || hasThue)) errs.push("Mâu thuẫn: Phiếu B1 khai Không có ai làm phi nông nghiệp nhưng chi tiết lại có thành viên đi làm.");

            // 4. Logic Lương hưu / Trợ cấp (B1.6 vs C20)
            let b1_6 = b1Answers['B1.6']; // 0: 1 người, 1: >=2, 2: Không ai
            let tcCount = phieuC_Data.filter(p => p.C20 && p.C20.length > 0).length;
            if (b1_6 === 2 && tcCount !== 0) errs.push(`Mâu thuẫn: Phiếu B1 khai không ai hưởng trợ cấp/lương hưu nhưng chi tiết có ${tcCount} người.`);
            if (b1_6 === 0 && tcCount !== 1) errs.push(`Mâu thuẫn: Phiếu B1 khai 1 người hưởng trợ cấp/lương hưu nhưng chi tiết có ${tcCount} người.`);
            if (b1_6 === 1 && tcCount < 2) errs.push(`Mâu thuẫn: Phiếu B1 khai >=2 người hưởng trợ cấp/lương hưu nhưng chi tiết có ${tcCount} người.`);

            // 5. Logic Bằng cấp (B1.4 vs C13)
            let b1_4 = b1Answers['B1.4']; // 0: ĐH, 1: TC, 2: SC, 3: Không
            let maxC13 = Math.max(...phieuC_Data.map(p => parseInt(p.C13) || 1));
            let matchBangCap = false;
            if (b1_4 === 0 && maxC13 >= 4) matchBangCap = true;
            else if (b1_4 === 1 && maxC13 === 3) matchBangCap = true;
            else if (b1_4 === 2 && maxC13 === 2) matchBangCap = true;
            else if (b1_4 === 3 && maxC13 === 1) matchBangCap = true;
            if (!matchBangCap) errs.push("Mâu thuẫn: Bằng cấp cao nhất khai ở Phiếu B1 không khớp với dữ liệu Trình độ đào tạo ở Phiếu C.");

            // 6. THUẬT TOÁN ĐỘ TUỔI LAO ĐỘNG ĐỘNG
            let namHienTai = new Date().getFullYear(); 
            let nguoiLaoDongCount = 0;
            phieuC_Data.forEach(p => {
                let tuoi = tinhTuoi(p.C4);
                if (tuoi.nam >= 15) {
                    let isLaoDong = false; let isMale = p.C7 === '1';
                    let maxThangNam = 60 * 12 + (namHienTai - 2021) * 3; if (maxThangNam > 62*12) maxThangNam = 62*12;
                    let maxThangNu = 55 * 12 + (namHienTai - 2021) * 4; if (maxThangNu > 60*12) maxThangNu = 60*12;
                    let currentThang = tuoi.nam * 12 + tuoi.thang;
                    
                    if (isMale && currentThang <= maxThangNam) isLaoDong = true;
                    if (!isMale && currentThang <= maxThangNu) isLaoDong = true;

                    if (p.C17 === '3') isLaoDong = false; // Mất khả năng LĐ
                    if (p.C10 === '1') isLaoDong = false; // Đang đi học
                    if (p.C21 === '1') isLaoDong = false; // Bệnh hiểm nghèo
                    if (p.C16 && p.C16.includes('2')) isLaoDong = false; // Khuyết tật
                    if (isLaoDong) nguoiLaoDongCount++;
                }
            });

            // 7. Logic Nguyên nhân nghèo (NNKK)
            let nnkk = hoGiaDinh_Data['NNKK'] || [];
            if (nnkk.includes('3') && nguoiLaoDongCount > 0) errs.push("Lỗi logic: Hộ khai NNKK là 'Không có lao động' nhưng thực tế có người trong độ tuổi LĐ và có khả năng làm việc.");
            if (nnkk.includes('7') && !phieuC_Data.some(p => p.C21 === '1')) errs.push("Lỗi logic: Hộ khai NNKK là 'Có người ốm đau' nhưng không có ai bị bệnh hiểm nghèo.");

            // 8. Logic Chính sách (Đang hưởng vs Mong muốn)
            let csDH = hoGiaDinh_Data['CS_DH'] || []; let csMM = hoGiaDinh_Data['CS_MM'] || [];
            let duplicates = csDH.filter(x => csMM.includes(x));
            if (duplicates.length > 0) errs.push("Lỗi logic: Chính sách hỗ trợ không được đánh dấu trùng lặp ở cả hai mục Đang hưởng và Mong muốn.");
            
            if (csDH.includes('2')) { // Giáo dục
                let hasHoc = phieuC_Data.some(p => p.C10 === '1' && ['2','3','4'].includes(p.C11));
                if (!hasHoc) errs.push("Chính sách Giáo dục (Đang hưởng): Không có thành viên nào đang học Tiểu học/THCS/THPT.");
            }
            if (csMM.includes('2')) { // Giáo dục MM
                let hasNeed = phieuC_Data.some(p => tinhTuoi(p.C4).nam >= 6 && p.C10 === '2' && p.C12 !== '4');
                if (!hasNeed) errs.push("Chính sách Giáo dục (Mong muốn): Không có trẻ >=6 tuổi nào thất học và chưa TN THPT.");
            }
            if (csDH.includes('1') && !phieuC_Data.some(p => p.C14 === '1')) errs.push("Chính sách Y tế (Đang hưởng): Không có thành viên nào có BHYT.");
            if (csMM.includes('1') && !phieuC_Data.some(p => p.C14 === '2')) errs.push("Chính sách Y tế (Mong muốn): Tất cả thành viên đều đã có BHYT.");
            if (csDH.includes('3')) { // Học nghề
                let hasNghe = phieuC_Data.some(p => p.C10 === '1' && ['5','6','7'].includes(p.C11));
                if (!hasNghe) errs.push("Chính sách Học nghề (Đang hưởng): Không có thành viên nào đang học nghề/TC/CĐ.");
            }
            if (csMM.includes('3')) {
                let hasNeedNghe = phieuC_Data.some(p => tinhTuoi(p.C4).nam >= 11 && p.C10 === '2');
                if (!hasNeedNghe) errs.push("Chính sách Học nghề (Mong muốn): Không có thành viên >=11 tuổi nào đang không đi học.");
            }
            if (csDH.includes('4') && !phieuC_Data.some(p => p.C17 === '1' && nguoiLaoDongCount > 0)) errs.push("Chính sách Việc làm (Đang hưởng): Không có thành viên nào trong độ tuổi LĐ đang làm việc.");
            if (csMM.includes('4') && !phieuC_Data.some(p => p.C17 === '2')) errs.push("Chính sách Việc làm (Mong muốn): Không có thành viên nào thất nghiệp.");

            // 9. Logic B1.8 vs Diện tích quy đổi (<8m2)
            let dtNha = parseFloat(hoGiaDinh_Data['B2.81'] || 0);
            let coGac = (hoGiaDinh_Data['B2.82'] || []).length > 0;
            let dtBinhQuan = (dtNha * (coGac ? 1.5 : 1)) / N;
            if (dtBinhQuan < 8) {
                if (b1Answers['B1.8'] !== 3) errs.push("Chưa nhất quán: Tổng diện tích nhà tính ra < 8m2/người, nhưng B1.8 lại khai >= 20m2.");
                if (finalData["7"]) errs.push("Chưa nhất quán: Tổng diện tích nhà tính ra < 8m2/người, nhưng Phiếu A lại đánh dấu diện tích >= 25m2.");
            }

            if (errs.length > 0) {
                alert("⚠️ PHÁT HIỆN MÂU THUẪN DỮ LIỆU:\n\n- " + errs.join("\n- ") + "\n\nVui lòng kiểm tra và sửa lại các mục bị sai lệch.");
                return false;
            }
            return true;
        }

        // --- HARDCORE LOGIC TÍNH TOÁN B2 ---
        function tinhToanLogicB2() {
            if(!crossCheckSecurity()) return; // CHẶN LỖI LOGIC NẾU PHÁT HIỆN MÂU THUẪN
            
            let hoQ = (appConfig.phieu_c || []).filter(q => q.isHo);
            hoGiaDinh_Data.txt_NNKK_7 = $('#txt_ho_NNKK_8').val() || "";

            let diemB2 = { B2_1: false, B2_2: false, B2_3: false, B2_4: false, B2_5: false, B2_6: false, B2_7: false, B2_8: false, B2_9: false, B2_10: false, B2_11: false, B2_12: false };
            let N = numMembers;

            diemB2.B2_1 = phieuC_Data.some(p => p.C17==='2' || p.C19==='2');
            let phuThuocCount = phieuC_Data.filter(p => { let age = tinhTuoi(p.C4).nam; return (age !== -1 && age < 18) || (p.C16 && p.C16.length > 0); }).length;
            diemB2.B2_2 = (phuThuocCount / N) > 0.5;

            diemB2.B2_3 = phieuC_Data.some(p => {
                let t = tinhTuoi(p.C4), gioi = p.C7;
                if(t.thang !== -1 && t.thang < 192) {
                    let chuan = appConfig.chuan_dinh_duong.find(c => c.gioi_tinh == gioi && c.thang_tuoi == t.thang);
                    if(chuan) {
                        if(t.thang < 120) { return (p.C9 && p.C9 < chuan.can_nang) || (p.C8 && p.C8 < chuan.chieu_cao); } 
                        else { return (p.C8 && p.C8 < chuan.chieu_cao); } 
                    }
                }
                return false;
            });

            diemB2.B2_4 = phieuC_Data.some(p => { let a=tinhTuoi(p.C4).nam; return a>=6 && a<=75 && p.C14==='2'; });

            diemB2.B2_5 = phieuC_Data.some(p => {
                let a = tinhTuoi(p.C4).nam;
                if(a>=16 && a<=30 && p.C10==='2') {
                    if(a<=18) return (parseInt(p.C12||0)<3) && p.C13==='1'; 
                    else return (parseInt(p.C12||0)<4) && p.C13==='1'; 
                }
                return false;
            });

            diemB2.B2_6 = phieuC_Data.some(p => {
                let a = tinhTuoi(p.C4).nam, c = parseInt(p.C11||0);
                if(a>=3 && a<16) {
                    if(a>=3 && a<=5) return c !== 1;
                    if(a===6) return c!==1 && c!==2;
                    if(a>=7 && a<=10) return c!==2;
                    if(a===11) return c!==2 && c!==3;
                    if(a>=12 && a<=14) return c!==3;
                    if(a===15) return c!==3 && c!==4;
                }
                return false;
            });

            let b27Ans = hoGiaDinh_Data['B2.7'] || []; let benChacCount = Array.isArray(b27Ans)?b27Ans.filter(x => x==='1'||x==='2'||x==='3').length:0;
            diemB2.B2_7 = benChacCount < 2;

            let dt = parseFloat(hoGiaDinh_Data['B2.81'] || 0); let hasGac = (hoGiaDinh_Data['B2.82'] || []).length > 0;
            diemB2.B2_8 = (dt * (hasGac ? 1.5 : 1)) / N < 8;

            diemB2.B2_9 = phieuC_Data.every(p => p.C15==='2');
            diemB2.B2_10 = (hoGiaDinh_Data['B2.10']||[]).includes('6'); 
            diemB2.B2_11 = (hoGiaDinh_Data['B2.11']||[]).includes('3'); 
            diemB2.B2_12 = (hoGiaDinh_Data['B2.12']||[]).includes('2'); 

            finalData.diemB2 = diemB2;

            // XÂY DỰNG GIAO DIỆN TỔNG KẾT PHIẾU B2
            let groupedB2 = {};
            (appConfig.phieu_b2_list || []).forEach(q => {
                if(!groupedB2[q.section]) groupedB2[q.section] = [];
                groupedB2[q.section].push(q);
            });

            let tickCount = 0;
            let htmlB2 = "<div class='review-checklist' style='margin-top:10px;'>";
            Object.keys(groupedB2).forEach(sec => {
                htmlB2 += `<h4 style="margin:15px 0 5px 0; color:#0056b3; border-bottom:1px solid #ccc; padding-bottom:5px;">[${sec}]</h4>`;
                groupedB2[sec].forEach(q => {
                    let m = q.ma.replace('.','_'); 
                    let isDinh = diemB2[m]; if(isDinh) tickCount++;
                    htmlB2 += `<div style="padding-left:10px;">${isDinh?'<strong style="color:red;">✅</strong>':'<span style="color:#aaa;">⬜</span>'} ${q.noidung}</div>`;
                });
            });
            htmlB2 += "</div>";
            
            finalData.TongDiemB2 = tickCount;
            let ketLuan = tickCount >= 3 ? `<span style="color:#dc3545; font-size:24px; font-weight:bold;">HỘ NGHÈO</span>` : `<span style="color:#fd7e14; font-size:24px; font-weight:bold;">HỘ CẬN NGHÈO</span>`;
            let borderColor = tickCount >= 3 ? '#dc3545' : '#fd7e14';
            
            // PANEL TOP RESULT
            $('#review-top-result').html(`
                <div style="background:#fff; border:3px solid ${borderColor}; border-radius:8px; padding:20px; margin-bottom:20px; text-align:center; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">
                    <p style="font-size:18px; margin-bottom:5px;">Tổng số chỉ số thiếu hụt: <span style="font-size:24px; font-weight:bold; color:#0056b3;">${tickCount}</span> / 12</p>
                    <p style="font-size:18px; margin-bottom:0;">Kết luận rà soát:</p>
                    <div style="margin-top:5px;">${ketLuan}</div>
                </div>
            `);
            $('#review-content-b2').html(htmlB2);

            // XÂY DỰNG GIAO DIỆN TỔNG KẾT PHIẾU C
            let pCQuestions = (appConfig.phieu_c || []).filter(q => !q.isHo && !(q.ghichu||"").includes('Matrix_CS'));
            let tableC_Html = `<div style="overflow-x:auto; margin-bottom:15px;"><table class="matrix-table" style="font-size:13px; min-width:800px;"><tr><th>Nội dung câu hỏi</th>`;
            for(let i=0; i<N; i++) tableC_Html += `<th style="width:120px; color:#0056b3;">${i===0?"Chủ hộ":`Thành viên ${i+1}`}</th>`;
            tableC_Html += `</tr>`;

            pCQuestions.forEach(q => {
                tableC_Html += `<tr><td><strong>${q.ma}.</strong> ${q.noidung}</td>`;
                for(let i=0; i<N; i++) {
                    let textVal = getAnswerText(q, phieuC_Data[i][q.ma]);
                    tableC_Html += `<td>${textVal}</td>`;
                }
                tableC_Html += `</tr>`;
            });
            tableC_Html += `</table></div>`;

            let nnkkList = ""; let qNN = hoQ.find(q=>q.ma==='NNKK');
            if(qNN) {
                (hoGiaDinh_Data['NNKK']||[]).forEach(v => {
                    let opt = qNN.options.find(o=>o.ma_lc===v);
                    if(opt) nnkkList += `<li>${opt.text.replace('(fill)','').trim()} ${v==='8'?`<strong style="color:#e83e8c;">(${hoGiaDinh_Data.txt_NNKK_7})</strong>`:''}</li>`;
                });
            }
            if(!nnkkList) nnkkList = "<li>Không có</li>";

            let csHtml = `<div style="overflow-x:auto;"><table class="matrix-table" style="font-size:14px; margin-top:10px;"><tr><th>Chính sách hỗ trợ</th><th>Đang Hưởng</th><th>Mong Muốn</th></tr>`;
            let qDH = hoQ.find(q=>q.ma==='CS_DH');
            if(qDH) {
                qDH.options.forEach(opt => {
                    let isDH = (hoGiaDinh_Data['CS_DH']||[]).includes(opt.ma_lc);
                    let isMM = (hoGiaDinh_Data['CS_MM']||[]).includes(opt.ma_lc);
                    if(isDH || isMM) {
                        csHtml += `<tr><td>${opt.text.replace('(fill)','').trim()}</td><td>${isDH?'<strong style="color:red;">✅</strong>':''}</td><td>${isMM?'<strong style="color:red;">✅</strong>':''}</td></tr>`;
                    }
                });
            }
            csHtml += `</table></div>`;

            $('#review-content-phieuc').html(`
                <p><strong>Tổng số thành viên trong hộ:</strong> <span style="font-weight:bold; color:#17a2b8; font-size:16px;">${N} người</span></p>
                ${tableC_Html}
                <p style="margin-bottom:5px; color:#17a2b8; font-size:16px;"><strong>Nguyên nhân hộ còn khó khăn:</strong></p><ul style="margin-top:0;">${nnkkList}</ul>
                <p style="margin-bottom:5px; color:#17a2b8; font-size:16px;"><strong>Các chính sách hỗ trợ Hộ mong muốn / đang hưởng:</strong></p>${csHtml}
            `);

            switchScreen('screen-nd-phieub2-review');
        }

        // --- WORD EXPORT PHIẾU C ---
        function prepareWordDataPhieuC() {
            let d = { ...prepareWordDataB1() }; 
            for(let i=0;i<=7;i++) d[`x_NNKK_${i}`] = (hoGiaDinh_Data['NNKK']||[]).includes(String(i+1)) ? "x" : "";
            d.txt_NNKK_7 = hoGiaDinh_Data.txt_NNKK_7 || "";
            for(let i=0;i<=12;i++) {
                d[`x_CSDH_${i}`] = (hoGiaDinh_Data['CS_DH']||[]).includes(String(i+1)) ? "x" : "";
                d[`x_CSMM_${i}`] = (hoGiaDinh_Data['CS_MM']||[]).includes(String(i+1)) ? "x" : "";
            }
            d.ThanhVien = phieuC_Data.map((p, idx) => {
                let row = { A: idx+1 };
                for(let i=2; i<=21; i++) { let v = p[`C${i}`]; row[`C${i}`] = Array.isArray(v) ? v.join(", ") : (v||""); }
                return row;
            });
            return d;
        }

            d.B2_Tong = finalData.TongDiemB2;

        async function taiFileWordB2() { handleDocxDownload(prepareWordDataB2(), "https://raw.githubusercontent.com/lehaphuong510/trasoathongheo/main/PhieuB2.docx", `PhieuB2_${finalData.B.replace(/\s+/g,'_')}.docx`); }
        async function taiFilePDFB2(btn) { handlePdfDownload(prepareWordDataB2(), "https://raw.githubusercontent.com/lehaphuong510/trasoathongheo/main/PhieuB2.docx", `PhieuB2_${finalData.B.replace(/\s+/g,'_')}.pdf`, btn); $('#dl-b2-options').slideUp(); }

        // --- CÁN BỘ LOGIN & DASHBOARD ---
        async function authCanBo(action, btn) {
            const u = $('#cb_username').val(), p = $('#cb_password').val(); if(!u||!p) return alert("Nhập đủ thông tin!");
            let ogText = btn.innerText; btn.innerText="⏳..."; btn.disabled=true;
            try {
                const data = await (await fetch(WORKER_URL, { method:'POST', body:JSON.stringify({action,username:u,password:p}) })).json();
                if(data.status==="success"){ currentUser=u; switchScreen('screen-canbo-dash'); loadDanhSachDotCanBo(); } else alert("Sai tài khoản!");
            } catch(e) {} btn.innerText=ogText; btn.disabled=false;
        }

        async function loadDanhSachDotCanBo() {
            $('#canbo-dot-list').html("<p>Đang tải...</p>");
            try {
                const data = await (await fetch(WORKER_URL, { method:'POST', body:JSON.stringify({action:"get_canbo_dots", username:currentUser}) })).json();
                if(data.status==="success"){
                    if(data.dots.length===0) return $('#canbo-dot-list').html("<p>Chưa có đợt</p>");
                    let html="";
                    data.dots.forEach(d => {
                        const statusText = d.trang_thai === 'Open' ? '🟢 Đang mở' : '🔴 Đã đóng';
                        html+=`<div class="dot-item" onclick="this.classList.toggle('open')">
                            <h4 style="margin:0; cursor:pointer;">📋 Đợt: ${d.ten_dot} <br><small style="color:#555; font-weight:normal;">Hạn kết thúc: ${d.ngay_ket_thuc} | ${statusText}</small></h4>
                            <div class="dot-actions">
                                <button class="btn-sm" onclick="xemTruocDocx('${d.id_dot}'); event.stopPropagation();">👀 Xem trước Phiếu A</button>
                                <button class="btn-sm" style="background-color: #28a745;" onclick="$('#dl-${d.id_dot}').slideToggle(); event.stopPropagation();">📥 Tải Phiếu A ▼</button>
                                <button class="btn-sm" onclick="chinhSua('${d.id_dot}', '${d.ngay_ket_thuc}'); event.stopPropagation();">✏️ Đổi Hạn</button>
                                <button class="btn-sm btn-danger" onclick="ketThuc('${d.id_dot}'); event.stopPropagation();">🔒 Kết thúc đợt</button>
                                <div id="dl-${d.id_dot}" style="display:none; margin-top: 10px; padding: 10px; border: 1px dashed #28a745; border-radius: 5px; background: #f8fff9;" onclick="event.stopPropagation();">
                                    <span style="font-size: 14px; margin-right: 10px; color: #155724; font-weight: bold;">Định dạng:</span>
                                    <button class="btn-sm" style="background:#28a745;" onclick="taiFileWord('${d.id_dot}')">📄 Word (.docx)</button>
                                    <button class="btn-sm btn-pdf" onclick="taiFilePDF('${d.id_dot}', this)">📕 PDF (.pdf)</button>
                                </div>
                            </div>
                        </div>`;
                    }); $('#canbo-dot-list').html(html);
                }
            } catch(e) {}
        }
        
        async function taoDot() {
            const payload = {
                action: "create_dot", username: currentUser,
                tinh: document.getElementById('cb_tinh').value,
                phuong: document.getElementById('cb_phuong').value,
                thon: document.getElementById('cb_thon').value,
                ngay_bat_dau: document.getElementById('cb_start').value,
                ngay_ket_thuc: document.getElementById('cb_end').value
            };
            if(!payload.tinh || !payload.thon) return alert("Vui lòng điền đủ địa bàn!");
            await fetch(WORKER_URL, { method: 'POST', body: JSON.stringify(payload) });
            alert("✅ Đã tạo đợt rà soát thành công!");
            
            $('#cb_tinh').val(null).trigger('change');
            $('#cb_phuong').val(null).trigger('change');
            document.getElementById('cb_thon').value = "";
            document.getElementById('cb_start').value = "";
            document.getElementById('cb_end').value = "";
            $('#form-tao-dot').slideUp(); 
            loadDanhSachDotCanBo(); 
        }

        async function xemTruocDocx(idDot) {
            document.getElementById('modal-title').innerText = "Xem Trước Phiếu A (Docx)";
            document.getElementById('modal-body').innerHTML = "<p style='padding:20px;'>Đang tải dữ liệu và tạo file xem trước...</p>";
            document.getElementById('myModal').style.display = 'block';
            try {
                const resData = await fetch(WORKER_URL, { method: 'POST', body: JSON.stringify({ action: "preview_dot", ID_Dot: idDot }) });
                const data = await resData.json();
                if (!data.Hogiadinh || data.Hogiadinh.length === 0) {
                    document.getElementById('modal-body').innerHTML = "<p style='padding:20px;'>Chưa có hồ sơ nào được nộp trong đợt này!</p>";
                    return;
                }
                const templateBuffer = await (await fetch("https://raw.githubusercontent.com/lehaphuong510/trasoathongheo/main/PhieuA.docx")).arrayBuffer();
                const zip = new PizZip(templateBuffer);
                const doc = new window.docxtemplater(zip, { paragraphLoop: true, linebreaks: true });
                doc.render({ Tinh_thanh: data.Tinh_thanh, Phuong_xa: data.Phuong_xa, Thon_to: data.Thon_to, Hogiadinh: data.Hogiadinh });
                const out = doc.getZip().generate({ type: "blob", mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" });
                document.getElementById('modal-body').innerHTML = ""; 
                await docx.renderAsync(out, document.getElementById('modal-body'), null, { className: "docx-preview", inWrapper: true, ignoreWidth: true, ignoreHeight: true });
            } catch (error) { 
                document.getElementById('modal-body').innerHTML = `<p style="color:red; padding:20px;">Lỗi hiển thị bản xem trước: ${error.message}</p>`; 
            }
        }

        async function chinhSua(idDot, currentEnd) {
            document.getElementById('modal-title').innerText = "Đổi Ngày Kết Thúc";
            document.getElementById('modal-body').innerHTML = `
                <div style="padding:20px;">
                    <input type="date" id="new_end_date" value="${currentEnd}">
                    <button class="btn" style="margin-top:15px;" onclick="luuChinhSua('${idDot}')">Lưu Thay Đổi</button>
                </div>
            `;
            document.getElementById('myModal').style.display = 'block';
        }

        async function luuChinhSua(idDot) {
            const newDate = document.getElementById('new_end_date').value;
            await fetch(WORKER_URL, { method: 'POST', body: JSON.stringify({ action: "edit_dot", ID_Dot: idDot, new_date: newDate }) });
            alert("Đã cập nhật ngày kết thúc!");
            document.getElementById('myModal').style.display = 'none';
            loadDanhSachDotCanBo();
        }

        async function ketThuc(idDot) {
            if(!confirm("Bạn có chắc muốn đóng đợt này? Người dân sẽ không thể nộp thêm.")) return;
            await fetch(WORKER_URL, { method: 'POST', body: JSON.stringify({ action: "close_dot", ID_Dot: idDot }) });
            alert("Đã khóa sổ đợt rà soát!");
            loadDanhSachDotCanBo();
        }

        async function taiFileWord(idDot) {
            alert("Đang xử lý dữ liệu và tạo file Word, vui lòng chờ...");
            try {
                const resData = await fetch(WORKER_URL, { method: 'POST', body: JSON.stringify({ action: "download_dot", ID_Dot: idDot }) });
                const data = await resData.json();
                if (!data.Hogiadinh || data.Hogiadinh.length === 0) return alert("Không có hồ sơ nào trong đợt rà soát này!");
                const templateBuffer = await (await fetch("https://raw.githubusercontent.com/lehaphuong510/trasoathongheo/main/PhieuA.docx")).arrayBuffer();
                const zip = new PizZip(templateBuffer);
                const doc = new window.docxtemplater(zip, { paragraphLoop: true, linebreaks: true });
                doc.render({ Tinh_thanh: data.Tinh_thanh, Phuong_xa: data.Phuong_xa, Thon_to: data.Thon_to, Hogiadinh: data.Hogiadinh });
                const out = doc.getZip().generate({ type: "blob", mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" });
                saveAs(out, `PhieuA_${idDot}.docx`);
            } catch (error) { console.error(error); alert("Lỗi tải file Word."); }
        }

        async function taiFilePDF(idDot, btnElement) {
            const orgText = btnElement.innerText;
            btnElement.innerText = "⏳ Đang tạo PDF..."; btnElement.disabled = true;
            try {
                const resData = await fetch(WORKER_URL, { method: 'POST', body: JSON.stringify({ action: "download_dot", ID_Dot: idDot }) });
                const data = await resData.json();
                if (!data.Hogiadinh || data.Hogiadinh.length === 0) { btnElement.innerText = orgText; btnElement.disabled = false; return alert("Không có hồ sơ nào!"); }
                const templateRes = await fetch("https://raw.githubusercontent.com/lehaphuong510/trasoathongheo/main/PhieuA.docx");
                const zip = new PizZip(await templateRes.arrayBuffer());
                const doc = new window.docxtemplater(zip, { paragraphLoop: true, linebreaks: true });
                doc.render({ Tinh_thanh: data.Tinh_thanh, Phuong_xa: data.Phuong_xa, Thon_to: data.Thon_to, Hogiadinh: data.Hogiadinh });
                
                const base64Docx = doc.getZip().generate({ type: "base64" });
                const pdfRes = await fetch(WORKER_URL, { method: "POST", body: JSON.stringify({ action: "convert_pdf", docxBase64: base64Docx }) });
                const pdfData = await pdfRes.json();
                
                if (pdfData.status === "success") {
                    const byteChars = atob(pdfData.pdfBase64);
                    const byteNums = new Array(byteChars.length);
                    for (let i = 0; i < byteChars.length; i++) byteNums[i] = byteChars.charCodeAt(i);
                    const blob = new Blob([new Uint8Array(byteNums)], { type: "application/pdf" });
                    saveAs(blob, `PhieuA_${idDot}.pdf`);
                } else alert("Lỗi convert PDF: " + pdfData.message);
            } catch (e) { alert("Lỗi kết nối tạo PDF!"); console.error(e); }
            btnElement.innerText = orgText; btnElement.disabled = false;
        }
    </script>
